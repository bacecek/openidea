id = "kotlin"
name = "Kotlin"
extensions = ["kt", "kts"]
line-comment = "//"
block-comment = ["/*", "*/"]
indent = { tab-size = 4, insert-spaces = true }
ui-mode = "Kotlin"
tree-sitter = "kotlin"

[[language-servers]]
name = "intellij-server"
command = "intellij-server"
args = ["--stdio"]
root-markers = ["settings.gradle.kts", "settings.gradle", "build.gradle.kts", "build.gradle", "pom.xml", "MODULE.bazel", "WORKSPACE", ".idea"]
install-hint = "Install it from Settings › Languages & Frameworks › Language Servers (IntelliJ IDEA Java and Kotlin server); needs an IntelliJ IDEA Ultimate license after a 30-day trial"

[language-servers.initialization-options]
intellijExtensions = true
lazyIntentions = true

[language-servers.settings.jetbrains.java]
"hints.collapse complex types" = true
"hints.settings.method parameter" = true
"hints.types.local variable" = true
"settings.types.lambda parameter" = true
"hints.types.call chain" = true

[language-servers.settings.jetbrains.kotlin]
"hints.settings.types.property" = true
"hints.settings.types.variable" = true
"hints.type.function.return" = true
"hints.type.function.parameter" = true
"hints.settings.lambda.return" = true
"hints.lambda.receivers.parameters" = true
"hints.settings.value.ranges" = true
"hints.value.kotlin.time" = true
"hints.parameters" = true
"hints.parameters.compiled" = true
"hints.call.chains" = false
"hints.parameters.excluded" = false

[[language-servers]]
name = "kotlin-lsp"
fallback = true
command = "kotlin-lsp"
args = ["--stdio"]
root-markers = ["settings.gradle.kts", "settings.gradle", "build.gradle.kts", "build.gradle", "pom.xml"]
install-hint = "Install JetBrains Kotlin LSP: brew install JetBrains/utils/kotlin-lsp (https://github.com/Kotlin/kotlin-lsp)"

[[language-servers]]
name = "kotlin-language-server"
# Alternative: used only when the server above is not installed.
fallback = true
command = "kotlin-language-server"
# Its bundled Kotlin compiler can't parse newer JDK versions ("25.0.4.1").
max-java = 21
root-markers = ["settings.gradle.kts", "settings.gradle", "build.gradle.kts", "build.gradle", "pom.xml"]
install-hint = "brew install kotlin-language-server (https://github.com/fwcd/kotlin-language-server)"

[debugger]
adapter = "kotlin-debug-adapter"
command = "kotlin-debug-adapter"
install-hint = "Install https://github.com/fwcd/kotlin-debug-adapter and put `kotlin-debug-adapter` on PATH"
